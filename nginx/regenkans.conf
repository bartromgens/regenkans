# VPS nginx configuration for regenkans
#
# Automated setup (recommended):
#   sudo ./scripts/setup-nginx.sh --email you@example.com
#
# Manual setup (first-time — certificates don't exist yet):
#   1. Install certbot:    sudo apt install certbot python3-certbot-nginx
#   2. Copy only the HTTP block to nginx so it can start without certificates:
#        sudo bash -c 'cat > /etc/nginx/sites-available/regenkans' << 'EOF'
#        server {
#            listen 80;
#            server_name regenkans.nl www.regenkans.nl;
#            location /.well-known/acme-challenge/ { root /var/www/html; }
#            location / { return 301 https://regenkans.nl$request_uri; }
#        }
#        EOF
#   3. Enable & reload:    sudo ln -s /etc/nginx/sites-available/regenkans /etc/nginx/sites-enabled/
#                          sudo nginx -t && sudo systemctl reload nginx
#   4. Obtain certificate: sudo certbot certonly --webroot -w /var/www/html -d regenkans.nl -d www.regenkans.nl
#   5. Copy this full file: sudo cp regenkans.conf /etc/nginx/sites-available/regenkans
#   6. Test & reload:      sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name regenkans.nl www.regenkans.nl;

    # Allow certbot webroot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://regenkans.nl$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.regenkans.nl;

    ssl_certificate /etc/letsencrypt/live/regenkans.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/regenkans.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://regenkans.nl$request_uri;
}

server {
    listen 443 ssl http2;
    server_name regenkans.nl;

    ssl_certificate /etc/letsencrypt/live/regenkans.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/regenkans.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rendered frames are immutable PNGs sitting on disk, written ahead of time
    # by the pre-render step of each ingest. Serving them straight from disk
    # keeps several MB of image bytes per visitor off gunicorn, which only has
    # three workers and also has to answer the timeline and point-series calls.
    #
    # A frame that is not on disk (pre-render skipped or failed) falls back to
    # @api, which renders it on demand exactly as before.
    #
    # The data path below must match the repo checkout on this host;
    # scripts/setup-nginx.sh rewrites it when it installs this file. nginx also
    # needs read access to it — see ensure_frame_read_access in that script.
    location ~ ^/api/radar/frames/(?<frame_file>[^/]+)\.h5/(?<frame_lead>\d+)\.png$ {
        alias /home/bart/regenkans/data/radar_forecast/frames/${frame_file}_${frame_lead}_3857.png;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 403 as well as 404: if nginx cannot read the file (a directory it
        # may not traverse) the request must still be served, not fail.
        error_page 403 404 = @api;
    }

    location ~ ^/api/ensemble/frames/(?<frame_file>[^/]+)\.nc/(?<frame_lead>\d+)\.png$ {
        alias /home/bart/regenkans/data/ensemble_forecast/frames/${frame_file}_${frame_lead}_pop01_3857.png;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        error_page 403 404 = @api;
    }

    location ~ ^/api/ensemble/expected/frames/(?<frame_file>[^/]+)\.nc/(?<frame_lead>\d+)\.png$ {
        alias /home/bart/regenkans/data/ensemble_forecast/frames/${frame_file}_${frame_lead}_expected_3857.png;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        error_page 403 404 = @api;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8070;
    }

    # Fallback target for the frame locations above. Everything else reaches
    # the API through the prefix location, so this is only used internally.
    location @api {
        proxy_pass http://127.0.0.1:8070;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8070;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8070;
    }

    location / {
        proxy_pass http://127.0.0.1:3070;
    }
}
