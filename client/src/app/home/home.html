<div class="map-layout" [class.map-layout--mobile]="layout.isMobile()">
  <h1 class="visually-hidden">Regenradar Nederland met kans op regen</h1>
  @if (layout.isMobile()) {
    <app-mobile-tabs
      [activeTab]="layout.mobileTab()"
      [chartNeedsAttention]="layout.chartTabNeedsAttention()"
      (tabChange)="onMobileTabChange($event)"
    />
  }

  <div class="pane-stack">
    <div class="map-pane" [class.map-pane--hidden]="!layout.mapVisible()">
      <div class="map-stage">
        <app-radar-map
          #radarMap
          [overlay]="timeline.overlay()"
          [markerLocation]="pointSeries.location()"
          (locationClick)="onMapClick($event)"
          (overlayApplied)="timeline.onOverlayApplied($event)"
          (overlayFailed)="timeline.onOverlayFailed($event)"
        />

        @if (!timeline.loading() && !timeline.timelineError()) {
          <app-mode-toggle
            [mode]="timeline.mode()"
            [ensembleAvailable]="timeline.ensembleAvailable()"
            [knmiEnsembleUnavailable]="timeline.knmiEnsembleUnavailable()"
            (modeChange)="timeline.setMode($event)"
          />

          <app-map-legend [mode]="timeline.mode()" />

          <app-refresh-button
            [refreshing]="timeline.refreshing()"
            [error]="timeline.refreshError()"
            (refresh)="timeline.manualRefresh()"
          />
        }
      </div>

      <app-timeline-panel
        [loading]="timeline.loading()"
        [timelineError]="timeline.timelineError()"
        [frameError]="timeline.frameError()"
        [frames]="timeline.sliderFrames()"
        [selectedIndex]="timeline.selectedIndex()"
        [nowIndex]="timeline.nowIndex()"
        [currentLabel]="timeline.currentLabel()"
        [playing]="timeline.playing()"
        (indexChange)="timeline.onSliderInput($event)"
        (indexCommit)="timeline.onSliderCommit($event)"
        (playToggle)="timeline.togglePlay()"
      />
    </div>

    <div
      class="chart-pane"
      [class.chart-pane--active]="!layout.mapVisible()"
      [class.chart-pane--overlay]="!layout.isMobile() && pointSeries.location()"
    >
      @if (!layout.mapVisible() && !pointSeries.location()) {
        <app-chart-placeholder
          [loading]="geolocation.loading()"
          [error]="geolocation.error()"
          (backToMap)="onMobileTabChange('map')"
        />
      }

      @if (showRainChart()) {
        <app-rain-chart
          #rainChart
          [series]="pointSeries.points()"
          [selectedValidAt]="timeline.selectedValidAt()"
          [loading]="pointSeries.loading()"
          [extending]="pointSeries.extending()"
          [error]="pointSeries.error()"
          [locationLabel]="pointSeries.locationLabel()"
          [maxAvailableHours]="pointSeries.maxAvailableHours()"
          [extendedWindow]="pointSeries.extendedWindow()"
          [showCloseButton]="!layout.isMobile()"
          (closed)="pointSeries.clear()"
          (windowChange)="pointSeries.setWindowExtended($event)"
        />
      }
    </div>
  </div>
</div>
