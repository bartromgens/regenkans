<div class="mode-toggle-overlay">
  <div class="mode-toggle">
    <button
      type="button"
      class="mode-toggle__button"
      [class.mode-toggle__button--active]="mode() === 'intensity'"
      (click)="selectMode('intensity')"
    >
      Intensity
    </button>
    <button
      type="button"
      class="mode-toggle__button"
      [class.mode-toggle__button--active]="mode() === 'probability'"
      [disabled]="!ensembleAvailable()"
      (click)="selectMode('probability')"
    >
      Probability
    </button>
  </div>

  @if (!ensembleAvailable()) {
    <div class="mode-toggle-hint">
      Probability view requires an ingested ensemble forecast.
    </div>
  }
</div>
