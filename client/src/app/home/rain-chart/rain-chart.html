<div class="rain-chart-panel">
  <div class="rain-chart-header">
    <div>
      <div class="rain-chart-title">Regen op deze locatie</div>
      @if (locationLabel()) {
        <div class="rain-chart-location">{{ locationLabel() }}</div>
      }
    </div>
    <div class="rain-chart-header-actions">
      @if (maxAvailableHours(); as hours) {
        <div class="rain-chart-window-toggle">
          <button
            type="button"
            class="rain-chart-window-toggle__button"
            [class.rain-chart-window-toggle__button--active]="!extendedWindow()"
            (click)="setWindow(false)"
          >
            2u
          </button>
          <button
            type="button"
            class="rain-chart-window-toggle__button"
            [class.rain-chart-window-toggle__button--active]="extendedWindow()"
            (click)="setWindow(true)"
          >
            {{ hours }}u
          </button>
        </div>
      }
      <button type="button" class="rain-chart-close" (click)="close()" aria-label="Grafiek sluiten">
        ×
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="rain-chart-state">Regenreeks wordt geladen…</div>
  } @else if (error()) {
    <div class="rain-chart-state rain-chart-state--error">{{ error() }}</div>
  } @else if (series().length === 0) {
    <div class="rain-chart-state">Geen regengegevens beschikbaar voor deze locatie.</div>
  } @else {
    <div class="rain-chart-canvas-wrap">
      <canvas #chartCanvas aria-label="Grafiek van regenintensiteit en -kans"></canvas>
    </div>
  }
</div>
